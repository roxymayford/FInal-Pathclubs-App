version: '3.8'

services:
  # 1. Machine Learning API (Flask)
  flask_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning_path_flask
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-iscLP}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-kelompok9}
      # Uncomment if using external PostgreSQL / MySQL
      # - DATABASE_URL=postgresql://user:password@db:5432/dbname
    volumes:
      - flask_data:/app

  # 2. Database for Laravel (MySQL)
  mysql_db:
    image: mysql:8.0
    container_name: learning_path_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-db_learning_path}
      MYSQL_USER: ${DB_USERNAME:-learning_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-learning_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 3. Main Auth & CRUD Server (Laravel)
  laravel_server:
    build:
      context: ./laravel/server
      dockerfile: Dockerfile
    container_name: learning_path_laravel
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mysql_db
    environment:
      - APP_NAME=LearningPath
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_learning_path}
      - DB_USERNAME=${DB_USERNAME:-learning_user}
      - DB_PASSWORD=${DB_PASSWORD:-learning_password}
      - RUN_MIGRATIONS=true
    volumes:
      - laravel_storage:/var/www/html/storage

  # 4. Frontend (React + Vite)
  frontend_client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning_path_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - flask_backend
      - laravel_server

volumes:
  mysql_data:
  flask_data:
  laravel_storage:
